name: CI & CD
on:
  push:
    branches:
      - main
jobs:
  Build-and-Deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WMA_ID: ${{ secrets.WMA_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Build WeChat version
        if: ${{ env.WMA_ID }}
        run: pnpm build-wx
        env:
          NODE_ENV: production

      - name: Get NPM version
        if: ${{ env.WMA_ID }}
        uses: martinbeentjes/npm-get-version-action@master
        id: package-version

      - name: Upload Artifact
        if: ${{ env.WMA_ID }}
        uses: actions/upload-artifact@v7
        with:
          name: Taro-miniapp-${{ steps.package-version.outputs.current-version }}-bundle
          path: ./dist/wx/

      - name: Upload to WeChat
        if: ${{ env.WMA_ID }}
        run: |
          cat > WMA-upload.key <<EOF
          ${{ secrets.WMA_UPLOAD_KEY }}
          EOF
          pnpx miniprogram-ci upload \
            --pp ./ \
            --pkp ./WMA-upload.key \
            --appid ${{ env.WMA_ID }} \
            --uv ${{ steps.package-version.outputs.current-version }}
